<?xml version='1.0'?>
<!DOCTYPE fontconfig SYSTEM 'fonts.dtd'>
<fontconfig>
  <!-- Any Arabic-script text resolves to SF Arabic system-wide -->
  <match target="pattern">
    <test name="lang" compare="contains">
      <string>ar</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>SF Arabic</string>
    </edit>
  </match>

  <!-- Fallback for mixed-script text: SF Arabic first (it has no Latin glyphs,
       so Latin text still falls through to the regular sans/serif families). -->
  <alias>
    <family>serif</family>
    <prefer>
      <family>SF Arabic</family>
      <family>Serif</family>
      <family>Joy Pixels</family>
    </prefer>
  </alias>
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>SF Arabic</family>
      <family>Sans</family>
      <family>Fira Sans</family>
      <family>Joy Pixels</family>
    </prefer>
  </alias>
  <alias>
    <family>sans</family>
    <prefer>
      <family>SF Arabic</family>
      <family>Sans</family>
      <family>Fira Sans</family>
      <family>Joy Pixels</family>
    </prefer>
  </alias>
  <alias>
    <family>monospace</family>
    <prefer>
      <family>SF Arabic</family>
      <family>Cascadia Code</family>
      <family>Sans Mono</family>
      <family>Joy Pixels</family>
    </prefer>
  </alias>
</fontconfig>
