<?xml version='1.0'?>
<!DOCTYPE fontconfig SYSTEM 'fonts.dtd'>
<fontconfig>
  <!-- Herdr NDot agent icons (herdr-icon-agent-ui PUA range U+E1A0-U+E1B0).
       Restrict the icon font so it can only ever supply these codepoints,
       then route the main terminal font's fallback through it first. -->
  <match target="font">
    <test name="family">
      <string>Herdr Agent Icons Max</string>
    </test>
    <edit name="charset" mode="assign" binding="strong">
      <charset>
        <int>0xE1A0</int>
        <int>0xE1A1</int>
        <int>0xE1A2</int>
        <int>0xE1A3</int>
        <int>0xE1A4</int>
        <int>0xE1A5</int>
        <int>0xE1A6</int>
        <int>0xE1A7</int>
        <int>0xE1A8</int>
        <int>0xE1A9</int>
        <int>0xE1AA</int>
        <int>0xE1AB</int>
        <int>0xE1AC</int>
        <int>0xE1AD</int>
        <int>0xE1AE</int>
        <int>0xE1AF</int>
        <int>0xE1B0</int>
      </charset>
    </edit>
  </match>
  <match target="pattern">
    <test name="family">
      <string>Departure Mono</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Herdr Agent Icons Max</string>
    </edit>
  </match>
</fontconfig>