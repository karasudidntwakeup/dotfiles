font_family      Departure Mono
font_size        11
bold_font        auto
italic_font      auto
bold_italic_font auto

# Retro CRT shaders (requires kitty >= 0.49).
# Pipelines live in ~/.config/kitty/shaders/retro-*.pipeline
# NOTE: crt shader needs background_opacity 1.0 (already set below).
# IMPORTANT: after upgrading kitty you must fully quit (not just reload),
# otherwise the old process keeps running without shader support.
custom_shaders retro-green-softglow
# Diagnostics: remote control socket so we can screenshot the live window.
# (Local socket only. Remove if you don't want it.)
allow_remote_control yes
listen_on unix:/tmp/kitty-main
# Alternatives (uncomment one):
# CRT family:
# custom_shaders retro-crt
# custom_shaders retro-crt-soft
# custom_shaders retro-crt-grille
# custom_shaders retro-crt-flicker
# custom_shaders retro-crt-glow
# custom_shaders retro-crt-full
# custom_shaders retro-crt-green
# custom_shaders retro-crt-amber
# custom_shaders retro-phosphor-green
# custom_shaders retro-phosphor-amber
# custom_shaders retro-crt-blue
# custom_shaders retro-tft
# Glow (bloom) family:
# custom_shaders glow-soft
# custom_shaders glow-strong
# custom_shaders glow-neon
# custom_shaders glow-pulse
# custom_shaders retro-neon-green
# custom_shaders retro-neon-amber
# Bundled originals also work directly:
# custom_shaders crt
# custom_shaders crt-blue
# custom_shaders tft

# Retro CRT feel that works on any version:
cursor_shape beam
cursor_beam_thickness 1.8
cursor_blink_interval 0.5
cursor_stop_blinking_after 0
cursor_trail 1

background_opacity 1.0
confirm_os_window_close 0

scrollback_lines 2000
wheel_scroll_min_lines 1

enable_audio_bell no
hide_window_decorations yes

window_padding_width 25

include ~/.config/kitty/colors.conf


# Nothing-style NDot agent icons (herdr-icon-agent-ui PUA range)
symbol_map U+E1A0-U+E1B0 Herdr Agent Icons Max
