include ~/.config/kitty/matugen-colors.conf
symbol_map U+0600-U+06FF,U+0750-U+077F,U+08A0-U+08FF,U+FB50-U+FDFF,U+FE70-U+FEFF SF Arabic
window_alert_on_bell no
force_ltr no
disable_ligatures always
wayland_enable_ime no
sync_to_monitor no
repaint_delay 2
input_delay 0
cursor_trail 1
cursor_trail_decay 0.1 0.4
# Font
font_family      Departure Mono
font_family= SF Arabic
font_size        10.5

# Window Padding
window_padding_width 30

# Colors & Transparency
background_opacity 0.4
ursor_shape           block
cursor_blink_interval  0.1

# Keybindings
map alt+up   scroll_page_up
map alt+down scroll_page_down
map alt+c    copy_to_clipboard
map alt+v    paste_from_clipboard
