# Mango config ported 1:1 from niri (~/.config/niri/)
# Sources: env.kdl, input.kdl, output.kdl, layout.kdl, colors.kdl, autostart.kdl, keybinds.kdl
# NOTE: niri is scrollable-tiling; mango uses per-tag scroller layout on all tags.
# Niri-only features (shaders, inhibit toggle, column-first/last) have no mango equivalent.

# ---------- Environment (from env.kdl) ----------
env=QT_QPA_PLATFORMTHEME,qt6ct
env=QT_QPA_PLATFORM,wayland
env=XDG_CURRENT_DESKTOP,mango
env=ELECTRON_OZONE_PLATFORM_HINT,auto
env=GDK_BACKEND,wayland,x11
env=MOZ_ENABLE_WAYLAND,1
env=MOZ_DBUS_REMOTE,1
env=QS_NO_SHADOW,1
# niri sets DISPLAY ":0" for xwayland-satellite; mango has built-in xwayland, not needed
# niri: prefer-no-csd / clipboard disable-primary / xwayland-satellite off / hot-corners off
# mango has no direct equivalents; CSD allowed per-app via windowrule allow_csd if needed

# ---------- Autostart (from autostart.kdl) ----------
exec-once=wl-paste --watch cliphist store
# audio stack must start in order: wireplumber needs pipewire+pulse sockets ready
exec-once=bash -c "pipewire & sleep 1; pipewire-pulse & sleep 1; exec wireplumber"
exec-once=awww-daemon
exec-once=bash -c "python3 /home/karasu/.config/quickshell/scripts/wa-notify.py"
exec-once=bash -c "/home/karasu/.config/quickshell/scripts/wa-follow-watch.sh"
exec-once=bash -c "QS_NO_SHADOW=1 qs -d --path /home/karasu/.config/quickshell/shell.qml"
exec-once=bash -c "cd /home/karasu/github/bombaclip && python3 -u bombaclip.py --token \"$(cat ~/.bombaclip_token)\" >> /tmp/bombaclip.log 2>&1"

# ---------- Output (from output.kdl: eDP-1 scale 1.0) ----------
monitorrule=name:^eDP-1$,scale:1

# ---------- Input (from input.kdl) ----------
# niri: focus-follows-mouse
sloppyfocus=1
warpcursor=0
focus_on_activate=1
# niri keyboard: repeat-delay 200, repeat-rate 40, layout us,ara, options grp:ctrl_space_toggle
repeat_rate=40
repeat_delay=200
xkb_rules_layout=us,ara
xkb_rules_options=grp:ctrl_space_toggle
# niri touchpad: accel-speed 0.25, click-method clickfinger, tap enabled
tap_to_click=1
tap_and_drag=1
trackpad_click_method=2
trackpad_accel_speed=0.25
# niri cursor: theme scm-quancifang-cursor-ac686609, size 45, hide-after 3000ms, hide-when-typing
cursor_theme=scm-quancifang-cursor-ac686609
cursor_size=45
cursor_hide_timeout=3
cursor_hide_on_keypress=1
# niri gestures (dnd-edge scroll/switch) have no direct mango equivalent; see gesturebind below

# ---------- Theming (from colors.kdl) ----------
# overview backdrop #11111b, active #89b4fa, inactive #a6adc8, urgent #f38ba8, shadow #000000
rootcolor=0x11111bff
focuscolor=0x89b4faff
bordercolor=0xa6adc8ff
urgentcolor=0xf38ba8ff
shadowscolor=0x000000ff

# ---------- Layout / gaps / borders (from layout.kdl: gaps 16) ----------
# focus ring ON: borderpx=4 (thicker to cover rounded-corner artifacts), focused=blue, unfocused=grey (from colors.kdl)
borderpx=4
no_border_when_single=0
smartgaps=0
gappih=0
gappiv=0
gappoh=0
gappov=0
# niri window-rule: geometry-corner-radius 15, clip-to-geometry true
# reduced to 8: large radii artifact at corners, 8 stays clean
border_radius=8
no_radius_when_single=0

# ---------- Blur / shadows (from layout.kdl: background-effect blur, shadow on soft/33 spread/4 offset 4x8) ----------
blur=1
blur_layer=1
blur_optimized=1
blur_params_num_passes=2
blur_params_radius=10
blur_params_noise=0.0
blur_params_brightness=0.9
blur_params_contrast=0.9
blur_params_saturation=1.2
shadows=1
layer_shadows=1
shadow_only_floating=0
shadows_size=12
shadows_blur=33
shadows_position_x=4
shadows_position_y=8

# ---------- Animations (niri animates by default; values from previous mango config) ----------
animations=1
layer_animations=1
animation_duration_open=400
animation_type_open=zoom
animation_type_close=fade
layer_animation_type_open=fade
layer_animation_type_close=fade
animation_fade_in=1
animation_fade_out=1
tag_animation_direction=0
animation_duration_tag=350
animation_duration_move=500
animation_duration_close=800
zoom_initial_ratio=0.3
zoom_end_ratio=0.7
fadein_begin_opacity=0.6
fadeout_begin_opacity=0.8
animation_curve_open=0.46,1.0,0.29,1.1
animation_curve_move=0.46,1.0,0.29,1
animation_curve_tag=0.46,1.0,0.29,1
animation_curve_close=0.08,0.92,0,1

# ---------- Scroller (niri: center-focused-column on-overflow + always-center-single-column) ----------
# mango mapping: prefer_center = on-overflow (only center when off-view),
# focus_center=0 so multi-window strip is NOT always recentered.
# single window uses default proportion and stays centered.
scroller_structs=0
scroller_default_proportion=0.8
scroller_focus_center=0
scroller_prefer_center=1
scroller_prefer_overspread=0
edge_scroller_pointer_focus=1
scroller_default_proportion_single=0.8
scroller_ignore_proportion_single=0
scroller_proportion_preset=0.5,0.8,1.0
# niri is always-scroller, so all tags default to scroller
tagrule=id:1,layout_name:scroller
tagrule=id:2,layout_name:scroller
tagrule=id:3,layout_name:scroller
tagrule=id:4,layout_name:scroller
tagrule=id:5,layout_name:scroller
tagrule=id:6,layout_name:scroller
tagrule=id:7,layout_name:scroller
tagrule=id:8,layout_name:scroller
tagrule=id:9,layout_name:scroller
circle_layout=scroller,tile,monocle,grid

# ---------- Window rules (from layout.kdl window-rules) ----------
windowrule=scroller_proportion:0.7,appid:librewolf
windowrule=scroller_proportion:0.3,appid:telegram
windowrule=scroller_proportion:0.95,appid:mpv
windowrule=isfloating:1,width:400,height:600,appid:xdg-desktop-portal-gtk
# niri pcmanfm rule is empty -> no mango rule needed
# avoid blur/anim artifacts on selection layers (mango equivalent of niri portal handling)
layerrule=noanim:1,noblur:1,layer_name:selection
# QS pickers are fullscreen transparent overlays: per-layer blur+shadow+anim on
# open costs a full-screen effect pass each frame -> stutter. Skip it for instant
# qs ipc opens (delete these if you prefer the blurred look and accept the lag).
layerrule=noanim:1,noblur:1,noshadow:1,layer_name:app-launcher
layerrule=noanim:1,noblur:1,noshadow:1,layer_name:ytx-picker
layerrule=noanim:1,noblur:1,noshadow:1,layer_name:whatsapp-picker
layerrule=noanim:1,noblur:1,noshadow:1,layer_name:clipboard-picker
layerrule=noanim:1,noblur:1,noshadow:1,layer_name:notes-picker
layerrule=noanim:1,noblur:1,noshadow:1,layer_name:wallpaper-picker
layerrule=noanim:1,noblur:1,noshadow:1,layer_name:notification-center
layerrule=noanim:1,noblur:1,noshadow:1,layer_name:qs-notif-popups
layerrule=noanim:1,noblur:1,noshadow:1,layer_name:calendar-card

# ---------- Mouse (mango equivalent of SUPER drag/resize) ----------
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize

# ---------- Gestures (matches old mango + niri overview usage) ----------
gesturebind=none,left,3,focusdir,left
gesturebind=none,right,3,focusdir,right
gesturebind=none,up,3,focusdir,up
gesturebind=none,down,3,focusdir,down
gesturebind=none,left,4,viewtoleft_have_client
gesturebind=none,right,4,viewtoright_have_client
gesturebind=none,up,4,toggleoverview
gesturebind=none,down,4,toggleoverview

# ---------- Axis (niri Mod+wheel mappings, direction preserved incl. inversion) ----------
axisbind=SUPER,DOWN,viewtoleft_have_client
axisbind=SUPER,UP,viewtoright_have_client
axisbind=SUPER+CTRL,DOWN,tagtoleft
axisbind=SUPER+CTRL,UP,tagtoright
axisbind=SUPER,RIGHT,focusdir,right
axisbind=SUPER,LEFT,focusdir,left
axisbind=SUPER+CTRL,RIGHT,exchange_client,right
axisbind=SUPER+CTRL,LEFT,exchange_client,left
axisbind=SUPER+SHIFT,DOWN,focusdir,right
axisbind=SUPER+SHIFT,UP,focusdir,left
axisbind=SUPER+CTRL+SHIFT,DOWN,exchange_client,right
axisbind=SUPER+CTRL+SHIFT,UP,exchange_client,left

# ---------- Keybinds (from keybinds.kdl; Mod == SUPER) ----------
# niri show-hotkey-overlay has no mango equivalent
# bind=SUPER+SHIFT,Slash,show-hotkey-overlay
bind=SUPER+SHIFT,S,spawn,~/.config/niri/shaders/qs.sh
bind=SUPER,Return,spawn,foot
bind=SUPER,space,spawn,qs ipc call launcher toggle
bind=SUPER,C,spawn,librewolf
bind=SUPER+SHIFT,Q,spawn,~/.config/quickshell/lock.sh
# allow-when-locked -> bindl
bindl=NONE,XF86AudioRaiseVolume,spawn,~/.config/quickshell/scripts/vol.sh up
bindl=NONE,XF86AudioLowerVolume,spawn,~/.config/quickshell/scripts/vol.sh down
bindl=NONE,XF86AudioMute,spawn,~/.config/quickshell/scripts/vol.sh mute
bindl=NONE,XF86AudioMicMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindl=NONE,XF86AudioPlay,spawn,playerctl play-pause
bindl=NONE,XF86AudioStop,spawn,playerctl stop
bindl=NONE,XF86AudioPrev,spawn,playerctl previous
bindl=NONE,XF86AudioNext,spawn,playerctl next
bindl=NONE,XF86MonBrightnessUp,spawn,light -A 10
bindl=NONE,XF86MonBrightnessDown,spawn,light -U 10
# overview (Mod+0 / Mod+W / Mod+Shift+o)
bind=SUPER,0,toggleoverview
bind=SUPER,W,toggleoverview
bind=SUPER+SHIFT,O,toggleoverview
# close
bind=SUPER,X,killclient
# focus (columns + window-or-workspace for J/K like niri)
bind=SUPER,Left,focusdir,left
bind=SUPER,Down,focusdir,down
bind=SUPER,Up,focusdir,up
bind=SUPER,Right,focusdir,right
bind=SUPER,H,focusdir,left
bind=SUPER,L,focusdir,right
bind=SUPER,J,focusdir,down
bind=SUPER,K,focusdir,up
# niri focus-column-first/last, move-column-to-first/last have no mango equivalent
# workspaces -> tags
bind=SUPER,Page_Down,viewtoright
bind=SUPER,Page_Up,viewtoleft
bind=SUPER,U,viewtoright
bind=SUPER,I,viewtoleft
bind=SUPER+CTRL,Page_Down,tagtoright
bind=SUPER+CTRL,Page_Up,tagtoleft
bind=SUPER+CTRL,U,tagtoright
bind=SUPER+CTRL,I,tagtoleft
# move columns/windows (niri move-column/move-window -> exchange_client)
bind=SUPER+CTRL,Left,exchange_client,left
bind=SUPER+CTRL,Right,exchange_client,right
bind=SUPER+CTRL,Down,exchange_client,down
bind=SUPER+CTRL,Up,exchange_client,up
bind=SUPER+CTRL,H,exchange_client,left
bind=SUPER+CTRL,L,exchange_client,right
bind=SUPER+CTRL,J,exchange_client,down
bind=SUPER+CTRL,K,exchange_client,up
bind=SUPER+SHIFT,Return,exchange_client,left
bind=SUPER+SHIFT,H,exchange_client,left
bind=SUPER+SHIFT,L,exchange_client,right
# tags 1-9 (view) + move-to-tag
bind=SUPER,1,comboview,1
bind=SUPER,2,comboview,2
bind=SUPER,3,comboview,3
bind=SUPER,4,comboview,4
bind=SUPER,5,comboview,5
bind=SUPER,6,comboview,6
bind=SUPER,7,comboview,7
bind=SUPER,8,comboview,8
bind=SUPER,9,comboview,9
bind=SUPER+SHIFT,1,tag,1
bind=SUPER+SHIFT,2,tag,2
bind=SUPER+SHIFT,3,tag,3
bind=SUPER+SHIFT,4,tag,4
bind=SUPER+SHIFT,5,tag,5
bind=SUPER+SHIFT,6,tag,6
bind=SUPER+SHIFT,7,tag,7
bind=SUPER+SHIFT,8,tag,8
bind=SUPER+SHIFT,9,tag,9
# niri quirk: Shift+j -> workspace 2, Shift+k -> workspace 1
bind=SUPER+SHIFT,J,tag,2
bind=SUPER+SHIFT,K,tag,1
# consume/expel (niri column join/split -> scroller_stack)
bind=SUPER,BracketLeft,scroller_stack,left
bind=SUPER,BracketRight,scroller_stack,right
bind=SUPER,Comma,scroller_stack,right
bind=SUPER,Period,scroller_stack,left
# presets / maximize / fullscreen / center / widths
bind=SUPER+SHIFT,R,switch_proportion_preset
bind=SUPER+CTRL,R,set_proportion,0.8
bind=SUPER,S,togglemaximizescreen
bind=SUPER,F,togglefullscreen
bind=SUPER+CTRL,F,set_proportion,1.0
bind=SUPER,B,centerwin
bind=SUPER+CTRL,C,centerwin
bind=SUPER,Minus,switch_proportion_preset,prev
bind=SUPER,Equal,switch_proportion_preset,next
bind=SUPER+SHIFT,Minus,smartresizewin,down
bind=SUPER+SHIFT,Equal,smartresizewin,up
# quickshell widgets (same commands as niri)
bind=SUPER,N,spawn,qs ipc call notifications toggle
bind=SUPER+SHIFT,N,togglefloating
bind=SUPER+SHIFT,V,toggle_all_floating
bind=SUPER,V,spawn,qs ipc call clipboard toggle
bind=SUPER,T,spawn,qs ipc call notes toggle
bind=SUPER,Z,spawn,qs ipc call ytx toggle
bind=SUPER+SHIFT,W,spawn,qs ipc call whatsapp toggle
bind=SUPER,G,spawn,qs ipc call wallpaper toggle
bind=SUPER+SHIFT,M,spawn,qs ipc call notifications toggle
bind=SUPER+SHIFT,C,spawn,~/.config/quickshell/scripts/scheme_fzf.sh
# screenshot (niri built-in -> grim+slurp like mango readme)
bind=NONE,Print,spawn_shell,grim -g "$(slurp)" - | wl-copy
# niri toggle-keyboard-shortcuts-inhibit has no mango dispatcher
# quit / monitors
bind=SUPER+SHIFT,E,quit
bind=CTRL+ALT,Delete,quit
bind=SUPER,P,sleep_toggle_monitor,all
# mango-only: hot-reload (niri reloads automatically)
bind=SUPER,R,reload_config
