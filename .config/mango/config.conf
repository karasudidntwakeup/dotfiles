# Mango config ported 1:1 from niri (~/.config/niri/)
# Split files live in config/ (mirrors niri's config.kdl includes).
# NOTE: niri is scrollable-tiling; mango uses per-tag scroller layout on all tags.
# Niri-only features (shaders, inhibit toggle, column-first/last) have no mango equivalent.
source=~/.config/mango/config/env.conf
source=~/.config/mango/config/autostart.conf
source=~/.config/mango/config/output.conf
source=~/.config/mango/config/input.conf
source=~/.config/mango/colors.conf
source=~/.config/mango/config/layout.conf
source=~/.config/mango/config/keybinds.conf
