# ---------- Autostart (from niri autostart.kdl) ----------
exec-once=wl-paste --watch cliphist store
# audio stack must start in order: wireplumber needs pipewire+pulse sockets ready
exec-once=bash -c "pipewire & sleep 1; pipewire-pulse & sleep 1; exec wireplumber"
# start daemon, wait for its socket, then restore last wallpaper instantly
# (daemon alone shows nothing; without this the picker must re-apply after restart)
exec-once=bash -c "pkill -x awww-daemon 2>/dev/null; awww-daemon & for i in $(seq 1 40); do awww query >/dev/null 2>&1 && break; sleep 0.25; done; IMG=$(cat ~/.cache/quickshell/wallpaper/current.txt 2>/dev/null); [ -f \"$IMG\" ] && exec awww img \"$IMG\" --transition-type none"
exec-once=bash -c "python3 /home/karasu/.config/quickshell/scripts/wa-notify.py"
exec-once=bash -c "/home/karasu/.config/quickshell/scripts/wa-follow-watch.sh"
exec-once=bash -c "pkill -x qs 2>/dev/null;pkill -x quickshell 2>/dev/null;sleep 1;exec qs -d --path /home/karasu/.config/quickshell/shell.qml"
exec-once=bash -c "pkill -f '^python3 -u .*bombaclip.py';sleep 1;WAYLAND_DISPLAY=$(ls -t /run/user/1000/|grep -m1 '^wayland-[0-9]*$') exec python3 -u /home/karasu/github/bombaclip/bombaclip.py --token $(cat ~/.bombaclip_token)>>/tmp/bombaclip.log 2>&1"
