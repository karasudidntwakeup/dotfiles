# ---------- Keybinds (from niri keybinds.kdl; Mod == SUPER) ----------

# ---------- Mouse (mango equivalent of SUPER drag/resize) ----------
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize

# ---------- Gestures (matches old mango + niri overview usage) ----------
gesturebind=none,left,3,focusdir,left
gesturebind=none,right,3,focusdir,right
gesturebind=none,up,3,focusdir,up
gesturebind=none,down,3,focusdir,down
gesturebind=none,left,4,viewtoleft_have_client
gesturebind=none,right,4,viewtoright_have_client
gesturebind=none,up,4,toggleoverview
gesturebind=none,down,4,toggleoverview

# ---------- Axis (niri Mod+wheel mappings, direction preserved incl. inversion) ----------
axisbind=SUPER,DOWN,viewtoleft_have_client
axisbind=SUPER,UP,viewtoright_have_client
axisbind=SUPER+CTRL,DOWN,tagtoleft
axisbind=SUPER+CTRL,UP,tagtoright
axisbind=SUPER,RIGHT,focusdir,right
axisbind=SUPER,LEFT,focusdir,left
axisbind=SUPER+CTRL,RIGHT,exchange_client,right
axisbind=SUPER+CTRL,LEFT,exchange_client,left
axisbind=SUPER+SHIFT,DOWN,focusdir,right
axisbind=SUPER+SHIFT,UP,focusdir,left
axisbind=SUPER+CTRL+SHIFT,DOWN,exchange_client,right
axisbind=SUPER+CTRL+SHIFT,UP,exchange_client,left

# niri show-hotkey-overlay has no mango equivalent
# bind=SUPER+SHIFT,Slash,show-hotkey-overlay
bind=SUPER+SHIFT,S,spawn,~/.config/niri/shaders/qs.sh
bind=SUPER,Return,spawn,foot
bind=SUPER,space,spawn,qs ipc call launcher toggle
bind=SUPER,C,spawn,librewolf
bind=SUPER+SHIFT,Q,spawn,~/.config/quickshell/lock.sh
# allow-when-locked -> bindl
bindl=NONE,XF86AudioRaiseVolume,spawn,~/.config/quickshell/scripts/vol.sh up
bindl=NONE,XF86AudioLowerVolume,spawn,~/.config/quickshell/scripts/vol.sh down
bindl=NONE,XF86AudioMute,spawn,~/.config/quickshell/scripts/vol.sh mute
bindl=NONE,XF86AudioMicMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindl=NONE,XF86AudioPlay,spawn,playerctl play-pause
bindl=NONE,XF86AudioStop,spawn,playerctl stop
bindl=NONE,XF86AudioPrev,spawn,playerctl previous
bindl=NONE,XF86AudioNext,spawn,playerctl next
bindl=NONE,XF86MonBrightnessUp,spawn,light -A 10
bindl=NONE,XF86MonBrightnessDown,spawn,light -U 10
# overview (Mod+0 / Mod+W / Mod+Shift+o)
bind=SUPER,0,toggleoverview
bind=SUPER,W,toggleoverview
bind=SUPER+SHIFT,O,toggleoverview
# move windows (like SUPER+SHIFT+H/L, but vertical)
bind=SUPER+SHIFT,J,exchange_client,down
bind=SUPER+SHIFT,K,exchange_client,up
# close
bind=SUPER,X,killclient
# focus (columns + window-or-workspace for J/K like niri)
bind=SUPER,Left,focusdir,left
bind=SUPER,Down,focusdir,down
bind=SUPER,Up,focusdir,up
bind=SUPER,Right,focusdir,right
bind=SUPER,H,focusdir,left
bind=SUPER,L,focusdir,right
bind=SUPER,J,focusdir,down
bind=SUPER,K,focusdir,up
# niri focus-column-first/last, move-column-to-first/last have no mango equivalent
# workspaces -> tags
bind=SUPER,Page_Down,viewtoright
bind=SUPER,Page_Up,viewtoleft
bind=SUPER,U,viewtoright
bind=SUPER,I,viewtoleft
bind=SUPER+CTRL,Page_Down,tagtoright
bind=SUPER+CTRL,Page_Up,tagtoleft
bind=SUPER+CTRL,U,tagtoright
bind=SUPER+CTRL,I,tagtoleft
# move columns/windows (niri move-column/move-window -> exchange_client)
bind=SUPER+CTRL,Left,exchange_client,left
bind=SUPER+CTRL,Right,exchange_client,right
bind=SUPER+CTRL,Down,exchange_client,down
bind=SUPER+CTRL,Up,exchange_client,up
bind=SUPER+CTRL,H,exchange_client,left
bind=SUPER+CTRL,L,exchange_client,right
bind=SUPER+CTRL,J,exchange_client,down
bind=SUPER+CTRL,K,exchange_client,up
bind=SUPER+SHIFT,Return,exchange_client,left
bind=SUPER+SHIFT,H,exchange_client,left
bind=SUPER+SHIFT,L,exchange_client,right
# tags 1-9 (view) + move-to-tag
bind=SUPER,1,comboview,1
bind=SUPER,2,comboview,2
bind=SUPER,3,comboview,3
bind=SUPER,4,comboview,4
bind=SUPER,5,comboview,5
bind=SUPER,6,comboview,6
bind=SUPER,7,comboview,7
bind=SUPER,8,comboview,8
bind=SUPER,9,comboview,9
bind=SUPER+SHIFT,1,tag,1
bind=SUPER+SHIFT,2,tag,2
bind=SUPER+SHIFT,3,tag,3
bind=SUPER+SHIFT,4,tag,4
bind=SUPER+SHIFT,5,tag,5
bind=SUPER+SHIFT,6,tag,6
bind=SUPER+SHIFT,7,tag,7
bind=SUPER+SHIFT,8,tag,8
bind=SUPER+SHIFT,9,tag,9
# consume/expel (niri column join/split -> scroller_stack)
bind=SUPER,BracketLeft,scroller_stack,left
bind=SUPER,BracketRight,scroller_stack,right
bind=SUPER,Comma,scroller_stack,right
bind=SUPER,Period,scroller_stack,left
# presets / maximize / fullscreen / center / widths
bind=SUPER+SHIFT,R,switch_proportion_preset
bind=SUPER+CTRL,R,set_proportion,0.8
bind=SUPER,S,togglemaximizescreen
bind=SUPER,F,togglefullscreen
bind=SUPER+CTRL,F,set_proportion,1.0
bind=SUPER,B,centerwin
bind=SUPER+CTRL,C,centerwin
bind=SUPER,Minus,switch_proportion_preset,prev
bind=SUPER,Equal,switch_proportion_preset,next
bind=SUPER+SHIFT,Minus,smartresizewin,down
bind=SUPER+SHIFT,Equal,smartresizewin,up
# layouts: cycle circle_layout (SUPER+D is free; tagrules keep scroller default).
# Other verified names you can swap in: vertical_tile,right_tile,vertical_scroller,
# vertical_grid,vertical_deck,fair,vertical_fair. Direct jump e.g.: bind=SUPER,Y,setlayout,dwindle
bind=SUPER,D,switch_layout
# quickshell widgets (same commands as niri)
bind=SUPER,N,spawn,qs ipc call notifications toggle
bind=SUPER,V,spawn,qs ipc call clipboard toggle
bind=SUPER,T,spawn,qs ipc call notes toggle
bind=SUPER,Z,spawn,qs ipc call ytx toggle
bind=SUPER+SHIFT,W,spawn,qs ipc call whatsapp toggle
bind=SUPER,G,spawn,qs ipc call wallpaper toggle
bind=SUPER+SHIFT,M,spawn,qs ipc call notifications toggle
bind=SUPER+SHIFT,C,spawn,~/.config/quickshell/scripts/scheme_fzf.sh
# screenshot (niri built-in -> grim+slurp like mango readme)
bind=NONE,Print,spawn_shell,grim -g "$(slurp)" - | wl-copy
# niri toggle-keyboard-shortcuts-inhibit has no mango dispatcher
# quit / monitors
bind=SUPER+SHIFT,E,quit
bind=CTRL+ALT,Delete,quit
bind=SUPER,P,sleep_toggle_monitor,all
# mango-only: hot-reload (niri reloads automatically)
bind=SUPER,R,reload_config
