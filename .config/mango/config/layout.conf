# ---------- Layout / gaps / borders (from niri layout.kdl: gaps 16) ----------
# focus ring ON: borderpx=4 (thicker to cover rounded-corner artifacts), focused=blue, unfocused=grey (from colors.kdl)
borderpx=3
no_border_when_single=0
smartgaps=10
gappih=10
gappiv=10
gappoh=15
gappov=15
# niri window-rule: geometry-corner-radius 15, clip-to-geometry true
# reduced to 8: large radii artifact at corners, 8 stays clean
border_radius=8
no_radius_when_single=0

# ---------- Blur / shadows (from niri layout.kdl: background-effect blur, shadow on soft/33 spread/4 offset 4x8) ----------
blur=1
blur_layer=1
blur_optimized=1
blur_params_num_passes=2
blur_params_radius=10
blur_params_noise=0.0
blur_params_brightness=0.9
blur_params_contrast=0.9
blur_params_saturation=1.2
shadows=1
# No per-layer shadow opt-out exists in mango 0.17.2 (no `noshadow` layerrule key
# in the binary; it would silently ignore it). layer_shadows=1 draws a shadow
# behind every layer rect, incl. QS fullscreen transparent overlays -> the broken
# look. QS draws its own shaped shadows (QS_NO_SHADOW unset, same as niri).
layer_shadows=0
shadow_only_floating=0
shadows_size=12
shadows_blur=33
shadows_position_x=4
shadows_position_y=8

# ---------- Animations (niri animates by default; values from previous mango config) ----------
animations=1
layer_animations=1
animation_duration_open=400
animation_type_open=zoom
animation_type_close=fade
layer_animation_type_open=fade
layer_animation_type_close=fade
animation_fade_in=1
animation_fade_out=1
tag_animation_direction=0
animation_duration_tag=350
animation_duration_move=500
animation_duration_close=800
zoom_initial_ratio=0.3
zoom_end_ratio=0.7
fadein_begin_opacity=0.6
fadeout_begin_opacity=0.8
animation_curve_open=0.46,1.0,0.29,1.1
animation_curve_move=0.46,1.0,0.29,1
animation_curve_tag=0.46,1.0,0.29,1
animation_curve_close=0.08,0.92,0,1

# ---------- Scroller (niri: center-focused-column on-overflow + always-center-single-column) ----------
# mango mapping: prefer_center = on-overflow (only center when off-view),
# focus_center=0 so multi-window strip is NOT always recentered.
# single window uses default proportion and stays centered.
scroller_structs=0
scroller_default_proportion=0.8
scroller_focus_center=0
scroller_prefer_center=1
scroller_prefer_overspread=0
edge_scroller_pointer_focus=1
scroller_default_proportion_single=0.8
scroller_ignore_proportion_single=0
scroller_proportion_preset=0.5,0.8,1.0
# niri is always-scroller, so all tags default to scroller
tagrule=id:1,layout_name:scroller
tagrule=id:2,layout_name:scroller
tagrule=id:3,layout_name:scroller
tagrule=id:4,layout_name:scroller
tagrule=id:5,layout_name:scroller
tagrule=id:6,layout_name:scroller
tagrule=id:7,layout_name:scroller
tagrule=id:8,layout_name:scroller
tagrule=id:9,layout_name:scroller
circle_layout=scroller,tile,grid,deck,center_tile,vertical_tile,right_tile,vertical_scroller,vertical_grid,vertical_deck,fair,vertical_fair

# ---------- Window rules (from niri layout.kdl window-rules) ----------
windowrule=scroller_proportion:0.7,appid:librewolf
windowrule=scroller_proportion:0.3,appid:telegram
windowrule=scroller_proportion:0.95,appid:mpv
windowrule=isfloating:1,width:400,height:600,appid:xdg-desktop-portal-gtk
# niri pcmanfm rule is empty -> no mango rule needed
# avoid blur/anim artifacts on selection layers (mango equivalent of niri portal handling)
layerrule=noanim:1,noblur:1,layer_name:selection
# QS pickers are fullscreen transparent overlays: per-layer blur+anim on
# open costs a full-screen effect pass each frame -> stutter. Skip it for instant
# qs ipc opens (delete these if you prefer the blurred look and accept the lag).
# NOTE: no `noshadow` key in mango 0.17.2 (silently ignored); layer shadows are
# off globally via layer_shadows=0 instead.
layerrule=noanim:1,noblur:1,layer_name:app-launcher
layerrule=noanim:1,noblur:1,layer_name:ytx-picker
layerrule=noanim:1,noblur:1,layer_name:whatsapp-picker
layerrule=noanim:1,noblur:1,layer_name:clipboard-picker
layerrule=noanim:1,noblur:1,layer_name:notes-picker
layerrule=noanim:1,noblur:1,layer_name:wallpaper-picker
layerrule=noanim:1,noblur:1,layer_name:notification-center
layerrule=noanim:1,noblur:1,layer_name:qs-notif-popups
layerrule=noanim:1,noblur:1,layer_name:calendar-card
# main bar has no explicit WlrLayershell.namespace in shell.qml; Quickshell's
# default namespace is "quickshell" (src/wayland/wlr_layershell/wlr_layershell.hpp).
# Skip mango blur + layer open-animation (those ghost on every qs start/reload).
# Bar shadow comes from QS's own Qt shadow (QS_NO_SHADOW unset), same as niri.
# Plain string, no regex anchors: matches whether mango uses substring or regex.
layerrule=noanim:1,noblur:1,layer_name:quickshell
