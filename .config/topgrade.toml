# Topgrade config — cleaned 2026-10-02
# Backup of previous 486-line file: topgrade.toml.bak-*
# Run `topgrade --config-reference` to see all defaults (don't copy them all here).

[misc]
# Installed via AUR (topgrade-bin), so pacman/yay owns updates.
# This kills the flaky "Checking target-arch / current / latest" self-update step
# (Reqwest timeouts + false "up-to-date") and lets the System step handle it.
no_self_update = true
disable = ["hyprpm", "stack", "tmux"]
run_in_tmux = false
notify_end = "on_failure"
sudo_command = "doas"

[linux]
# Was "pacman" + a custom "yay -Syyu" command = system updated TWICE,
# with AUR packages only covered by the duplicate. Use yay once.
arch_package_manager = "yay"
yay_arguments = "--nodevel"

[git]
# Removed broken entries: ~/github/Niri-glass (missing),
# ~/github/somewhere/fzf-tab.plugin.zsh (that's a FILE inside the repo),
# ~/.config/something (placeholder). Keep only real repos.
repos = [
  "~/github/powerlevel10k",
  "~/github/zsh-syntax-highlighting",
  "~/github/somewhere",
]

[vim]
force_plug_update = true

[firmware]
upgrade = true
