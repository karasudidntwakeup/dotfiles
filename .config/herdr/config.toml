onboarding = false
# ~/.config/herdr/config.toml

[theme]
name = "terminal"

auto_switch = false
[keys]
resize_mode = "prefix+shift+r"  
goto = "prefix+g"
rename_workspace = "prefix+r"
detach = "prefix+d"
new_workspace = "prefix+n"
next_tab      = "prefix+shift+n"
previous_tab = "prefix+p"
prefix = "ctrl+s"
split_horizontal = "prefix+minus"
split_vertical = "prefix+|"
focus_pane_left  = "ctrl+h"
focus_pane_down  = "ctrl+j"
focus_pane_up    = "ctrl+k"
focus_pane_right = "ctrl+l"
[ui]
mouse_capture = true   # default is already true, included for parity with `set -g mouse on`

show_agent_labels_on_pane_borders = true
status_indicators = "dots"
agent_panel_sort = "spaces"

# Nothing OS-style agent icons: NDot dot-matrix glyphs (custom font,
# mapped in kitty via symbol_map) + monochrome palette. Nothing Red for
# blocked, white/slate for everything else.
[ui.sidebar.agents]
row_gap = 0
rows = [
  [{ token = "$hs_group", bold = true, fg = "#FFFFFF" }, { token = "$hs_group_dim", dim = true, fg = "#6E6E70" }],
  [{ token = "$hs_terminals", dim = true, fg = "#6E6E70" }],
  [{ token = "$hs_tab", fg = "#E4E4E6" }, { token = "$hs_tab_dim", dim = true, fg = "#6E6E70" }],
  [
    { token = "$hs_logo", fg = "#FFFFFF" },
    { token = "$hs_logo_dim", dim = true, fg = "#6E6E70" },
    { token = "$hs_working", fg = "#E4E4E6" },
    { token = "$hs_working_dim", dim = true, fg = "#6E6E70" },
    { token = "$hs_blocked", fg = "#FF3030" },
    { token = "$hs_blocked_dim", dim = true, fg = "#6E6E70" },
    { token = "$hs_done", fg = "#FFFFFF" },
    { token = "$hs_done_dim", dim = true, fg = "#6E6E70" },
    { token = "$hs_idle", fg = "#A8A8AC" },
    { token = "$hs_idle_dim", dim = true, fg = "#6E6E70" },
    { token = "$hs_unknown", fg = "#A8A8AC" },
    { token = "$hs_unknown_dim", dim = true, fg = "#6E6E70" },
  ],
  [{ token = "$hs_gap" }],
]

[ui.sidebar.agents.rows_by_agent]
opencode = [
  [{ token = "$hs_group", bold = true, fg = "#FFFFFF" }, { token = "$hs_group_dim", dim = true, fg = "#6E6E70" }],
  [{ token = "$hs_terminals", dim = true, fg = "#6E6E70" }],
  [{ token = "$hs_tab", fg = "#E4E4E6" }, { token = "$hs_tab_dim", dim = true, fg = "#6E6E70" }],
  [
    { token = "$hs_logo", fg = "#FFFFFF" },
    { token = "$hs_logo_dim", dim = true, fg = "#6E6E70" },
    { token = "$hs_working", fg = "#E4E4E6" },
    { token = "$hs_working_dim", dim = true, fg = "#6E6E70" },
    { token = "$hs_blocked", fg = "#FF3030" },
    { token = "$hs_blocked_dim", dim = true, fg = "#6E6E70" },
    { token = "$hs_done", fg = "#FFFFFF" },
    { token = "$hs_done_dim", dim = true, fg = "#6E6E70" },
    { token = "$hs_idle", fg = "#A8A8AC" },
    { token = "$hs_idle_dim", dim = true, fg = "#6E6E70" },
    { token = "$hs_unknown", fg = "#A8A8AC" },
    { token = "$hs_unknown_dim", dim = true, fg = "#6E6E70" },
  ],
  [{ token = "$hs_gap" }],
]
[ui.sound]
enabled = true

[ui.toast]
delivery = "system"

[experimental]
allow_nested = true
switch_ascii_input_source_in_prefix = false
