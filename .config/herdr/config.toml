onboarding = false
# ~/.config/herdr/config.toml

[theme]
name = "terminal"

auto_switch = false
[keys]
resize_mode = "prefix+shift+r"  
goto = "prefix+g"
rename_workspace = "prefix+r"
detach = "prefix+d"
new_workspace = "prefix+n"
prefix = "ctrl+s"
switch_workspace = ""
# workspaces-only: tabs disabled
new_tab = ""
rename_tab = ""
previous_tab = ""
next_tab = ""
move_tab_previous = ""
move_tab_next = ""
switch_tab = ""
close_tab = ""
split_horizontal = "prefix+minus"
split_vertical = "prefix+|"
focus_pane_left  = "ctrl+h"
focus_pane_down  = "ctrl+j"
focus_pane_up    = "ctrl+k"
focus_pane_right = "ctrl+l"
[ui]
mouse_capture = true   # default is already true, included for parity with `set -g mouse on`

show_agent_labels_on_pane_borders = true
status_indicators = "dots"
agent_panel_sort = "spaces"
hide_tab_bar_when_single_tab = true
[ui.sound]
enabled = false

[ui.toast]
delivery = "system"

[experimental]
allow_nested = true
switch_ascii_input_source_in_prefix = false

[[keys.command]]
key = "prefix+1"
type = "shell"
command = "~/.config/herdr/scripts/goto-or-create-workspace.sh 1"
description = "goto or create workspace 1"

[[keys.command]]
key = "prefix+2"
type = "shell"
command = "~/.config/herdr/scripts/goto-or-create-workspace.sh 2"
