# ~/.config/mpv/input.conf — vim-style seeks kept, plus standard essentials
# Your bindings (preserved):
l seek 5
h seek -5
k seek 60
j seek -60

# Subtitles / audio
S cycle sub
A cycle audio
v cycle sub-visibility

# Playback
SPACE cycle pause
q quit
Q quit-watch-later
f cycle fullscreen
T cycle ontop
o show-progress
i script-binding stats/display-stats-toggle
` script-binding console/enable

# Speed / frames
[ multiply speed 0.9091
] multiply speed 1.1
BS set speed 1.0
. frame-step
, frame-back-step

# Volume / mute
m cycle mute
WHEEL_UP add volume 2
WHEEL_DOWN add volume -2
* add volume 5
/ add volume -5

# Chapters / playlist
> add chapter 1
< add chapter -1
ENTER playlist-next
SHIFT+ENTER playlist-prev

# Screenshots / subs position
s screenshot
Alt+s screenshot video
ALT+UP add sub-pos -1
ALT+DOWN add sub-pos +1

# SponsorBlock (po5/mpv_sponsorblock) — Alt-based so vim-style h/j/k/l seeks keep working.
# g/G/h/H defaults from the script would clash with `h` seek, so these are explicit.
Alt+g script-binding sponsorblock/set_segment
Alt+G script-binding sponsorblock/submit_segment
Alt+h script-binding sponsorblock/upvote_segment
Alt+H script-binding sponsorblock/downvote_segment

# Mouse
MOUSE_BTN0 cycle pause
MOUSE_BTN2 cycle fullscreen
MOUSE_BTN3 cycle ontop
