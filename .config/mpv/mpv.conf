# ~/.config/mpv/mpv.conf — clean, highly compatible (mpv 0.41, Intel+NVIDIA, Wayland, PipeWire)
# Only stable, auto-fallback options. No deprecated vo=gpu / gpu-api stuff.

# --- Video output (modern libplacebo, auto Wayland/X11) ---
vo=gpu-next
hwdec=auto-safe
hwdec-codecs=all
video-sync=display-resample

# --- Audio (PipeWire with safe fallbacks) ---
ao=pipewire,pulse,alsa
audio-channels=auto-safe
volume-max=150

# --- Languages ---
slang=en,eng,ar,ara,de,deu,ja,jpn
alang=en,eng,ja,jpn,ar,ara,de,deu
sub-auto=fuzzy
subs-fallback=yes

# --- Online playback (yt-dlp, safe network defaults) ---
ytdl-format=bv*[height<=2160]+ba/b/bv*+ba/b
hls-bitrate=max
demuxer-max-bytes=500MiB
demuxer-max-back-bytes=100MiB
cache-secs=30
network-timeout=30

# --- Window / OSD (no empty window when nothing loaded) ---
osc=yes
osd-level=1
osd-bar=yes
border=yes
keep-open=no
keep-open-pause=no
force-window=no
idle=no
autofit-larger=90%x90%
screenshot-directory=~/Pictures/mpv
screenshot-template="%F-%P"
save-position-on-quit=no

# --- Quality (balanced: looks great on UHD 630 + GTX 1650, no stutter) ---
profile=high-quality
scale=ewa_lanczossharp
cscale=ewa_lanczossharp
dscale=mitchell
correct-downscaling=yes
linear-downscaling=no
sigmoid-upscaling=yes
deband=yes
dither-depth=auto
target-contrast=auto
target-peak=auto
tone-mapping=auto
icc-profile-auto=yes
