# ~/.config/mpv/mpv.conf — clean, highly compatible (mpv 0.41, Intel+NVIDIA, Wayland, PipeWire)
# Only stable, auto-fallback options. No deprecated vo=gpu / gpu-api stuff.

# --- Video output (modern libplacebo, auto Wayland/X11) ---
# 1080p low-CPU: UHD 630 does H.264 in hardware, VP9 partial, AV1 not at
# all — so prefer AVC and never fetch above the panel resolution.
vo=gpu-next
hwdec=auto-safe
hwdec-codecs=all
video-sync=audio

# --- Audio (PipeWire with safe fallbacks) ---
ao=pipewire,pulse,alsa
audio-channels=auto-safe
volume-max=150

# --- Languages ---
slang=en,eng,ar,ara,de,deu,ja,jpn
alang=en,eng,ja,jpn,ar,ara,de,deu
sub-auto=fuzzy
subs-fallback=yes

# --- Online playback (yt-dlp, 1080p-capped for low CPU) ---
# Screen is 1920x1080: fetching 1440p/4K only burns CPU downscaling it.
# Prefer AVC (H.264) so the UHD 630 can hardware-decode; fall back to
# whatever is available at <=1080p60.
ytdl-format=bv*[height<=1080][fps<=60][vcodec~='^(avc|h264)']+ba/bv*[height<=1080][fps<=60]+ba/b[height<=1080]/b
hls-bitrate=max
demuxer-max-bytes=150MiB
demuxer-max-back-bytes=50MiB
cache-secs=10
network-timeout=30

# --- Window / OSD (no empty window when nothing loaded) ---
osc=yes
osd-level=1
osd-bar=yes
border=yes
keep-open=no
keep-open-pause=no
force-window=no
idle=no
autofit-larger=90%x90%
screenshot-directory=~/Pictures/mpv
screenshot-template="%F-%P"
save-position-on-quit=no

# --- Quality (1080p low-CPU: native res needs no costly upscalers) ---
# high-quality + ewa_lanczossharp + deband + display-resample kept the
# iGPU/CPU saturated. At 1:1 1080p, fast + mitchell looks identical
# while using a fraction of the power. Deband/tone-mapping/ICC stay off
# (GPU shaders on UHD 630); re-enable per-file with --deband=yes if needed.
profile=fast
scale=mitchell
cscale=mitchell
dscale=mitchell
correct-downscaling=yes
linear-downscaling=no
sigmoid-upscaling=yes
deband=no
dither-depth=auto
