# ~/.config/mpv/mpv.conf
# Optimized for mpv 0.41 / Intel UHD 630 + GTX 1650 Mobile (no AV1 HW decode) / yt-dlp / Wayland (niri)
# Removed slop: dup slang/sub-auto, broken icc-profile path, gpu-api=opengl,
# hwdec-codecs filter, cache=yes, oversized demuxer-max-*, manual scalers,
# interpolation/tscale, vd-lavc-dr, window-minimized.

###############
# Video output
###############
# NOTE: was vo=gpu-next + profile=high-quality. Two problems on your machine:
# 1. high-quality forces ewa_lanczossharp — too heavy for UHD 630, drops frames.
# 2. gpu-next defaults to Vulkan, but only the NVIDIA ICD is installed
#    (vulkan-intel missing), so every frame went through the dGPU + PRIME copy.
# vo=gpu uses EGL on the Intel iGPU directly: zero-copy VAAPI, much smoother.
# After `sudo pacman -S vulkan-intel` you can switch back to vo=gpu-next.
vo=gpu
scale=spline36                  # sweet spot for UHD 630: sharper than bilinear, far cheaper than ewa_lanczossharp
cscale=spline36
dscale=mitchell
correct-downscaling=yes
video-sync=audio                # cheapest sync; display-resample costs GPU every frame
hwdec=auto-safe
vd-lavc-threads=0               # auto = all 8 threads; helps when AV1 falls back to software
target-colorspace-hint=yes

###############
# Color management (ICC)
###############
# Old icc-profile="~/.config/niri/mac.icc" removed: file does not exist and broke startup.
# icc-profile-auto=yes is OFF on purpose: 3DLUT per frame costs ~10-20% GPU on UHD 630.
# Turn it back on only for color-critical work on the NVIDIA GPU.
icc-profile-auto=no
icc-cache-dir=~/.config/mpv/icc-cache

###############
# Streaming / yt-dlp
###############
# Prefer HW-decodable codecs (vp9/avc over av1, no AV1 HW on TU117/UHD630), cap at 1080p.
ytdl-format=bv*[height<=1080][vcodec!=av01]+ba/b/bv*+ba/b
hls-bitrate=max
demuxer-readahead-secs=30         # replaces cache=yes + 500MiB/200MiB buffers (defaults are fine, this is enough for network)
cache-pause=yes

###############
# Languages
###############
slang=ara,ar,deu,de
alang=en,eng,jpn,ja
sub-auto=fuzzy
audio-file-auto=fuzzy

###############
# Subtitles
###############
sub-font-size=38
sub-color="#FFFFFF"
sub-border-size=2
sub-shadow-offset=1
demuxer-mkv-subtitle-preroll=yes  # fewer missing lines on seeks
sub-ass-override=no               # respect styled ASS, set to 'force' if you want uniform look

###############
# Audio
###############
volume=100
volume-max=130                    # was 150 (clipping risk); 130 is safer
audio-normalize-downmix=yes       # consistent loudness for multichannel -> stereo

###############
# OSD / UI / Window
###############
osc=yes
osd-bar=yes
osd-font-size=32
autofit-larger=90%x90%
keep-open=yes
keep-open-pause=no
save-position-on-quit=yes         # was no; resume where you left off
resume-playback-check-mtime=yes   # don't resume if file changed

###############
# Screenshots
###############
screenshot-format=png
screenshot-directory=~/Pictures/mpv-screenshots
screenshot-template="%F-%p-%n"

###############
# Auto profiles: drop scalers when the iGPU can't keep up
###############
# Software decode (e.g. AV1 1080p+ — neither UHD 630 nor GTX 1650 has AV1 HW):
# decoding already saturates the i5-9300H, so don't waste GPU on fancy scaling.
[sw-decode]
profile-cond=p["hwdec-current"] == false
profile-restore=copy
scale=bilinear
cscale=bilinear

# Big / high-fps video (4K or >50fps): spline36 is too heavy for UHD 630.
[big-video]
profile-cond=(p["dwidth"] or 0) > 1920 or (p["container-fps"] or 0) > 50
profile-restore=copy
scale=bilinear
cscale=bilinear
dscale=bilinear
