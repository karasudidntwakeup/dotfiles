# ---------- Environment (from niri env.kdl) ----------
env=QT_QPA_PLATFORMTHEME,qt6ct
env=QT_QPA_PLATFORM,wayland
env=XDG_CURRENT_DESKTOP,mango
env=ELECTRON_OZONE_PLATFORM_HINT,auto
env=GDK_BACKEND,wayland,x11
env=MOZ_ENABLE_WAYLAND,1
env=MOZ_DBUS_REMOTE,1
# QS_NO_SHADOW intentionally unset: QS draws its own shaped Qt shadows
# (same as under niri); mango draws no layer shadows (see layer_shadows=0).
# niri sets DISPLAY ":0" for xwayland-satellite; mango has built-in xwayland, not needed
# niri: prefer-no-csd / clipboard disable-primary / xwayland-satellite off / hot-corners off
# mango has no direct equivalents; CSD allowed per-app via windowrule allow_csd if needed
